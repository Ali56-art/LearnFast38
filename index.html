<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFast - Bahçeşehir Koleji Portalı</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --student-accent: #ff6b6b;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            transition: all 0.3s ease;
        }

        .dashboard-container { max-width: 950px; }

        h2, h3, h4 { color: #2d3748; margin-top: 0; }

        .sub-title {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; color: #4a5568; font-weight: 600; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e0;
            border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }

        .captcha-box {
            background: #f7fafc; border: 1px solid #e2e8f0;
            border-radius: 8px; padding: 12px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary);
            border: none; border-radius: 8px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-dark); }

        .student-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: none; border-radius: 8px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .hidden { display: none !important; }

        .divider { text-align: center; margin: 15px 0; color: #a0aec0; font-size: 13px; }

        .option-card {
            border: 2px solid #e2e8f0; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 10px; display: flex;
            align-items: center; gap: 12px; cursor: pointer; background: #f7fafc;
        }

        /* DASHBOARD */
        .welcome-header {
            background: #edf2f7; padding: 20px; border-radius: 12px;
            margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .ai-assistant-btn {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white; border: none; padding: 10px 15px; border-radius: 8px;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(72, 187, 120, 0.3);
        }

        .subject-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px; margin-bottom: 25px;
        }

        .subject-card {
            background: white; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 25px 15px; text-align: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .subject-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15); }

        .subject-card.disabled-subject {
            background: #edf2f7; border-color: #cbd5e0; cursor: not-allowed; opacity: 0.5; transform: none !important; box-shadow: none !important;
        }

        .subject-icon { font-size: 38px; margin-bottom: 10px; }
        .subject-title { font-size: 18px; color: #2d3748; font-weight: bold; }
        .subject-sub { font-size: 12px; color: #718096; font-weight: normal; }

        .unit-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .unit-card { border: 2px solid #e2e8f0; border-radius: 10px; background: #ffffff; overflow: hidden; }

        .unit-header {
            background: #f8fafc; padding: 16px 20px; font-weight: bold;
            font-size: 16px; color: #2d3748; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }

        .unit-body { padding: 20px; background: #faf5ff; border-top: 1px dashed #cbd5e0; }

        .action-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }

        .action-btn {
            background: white; border: 2px solid var(--primary); color: var(--primary);
            padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;
            flex: 1; text-align: left; transition: all 0.2s;
        }
        .action-btn:hover { background: var(--primary); color: white; }
